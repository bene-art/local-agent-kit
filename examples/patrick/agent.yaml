# Example agent.yaml — Patrick (reference implementation).
#
# This config builds a Patrick-style agent using only the kit's built-in
# features (CLI channel, DuckDuckGo search). The full Patrick agent
# (with its custom tool router) lives at https://github.com/bene-art/patrick-agent
# and extends this config with patrick-agent/scripts/run_patrick.py.
#
# Run from the kit:  lak bot examples/patrick

name: Patrick
model: gemma3:12b

temperature: 0.4
max_tokens: 350

ollama_host: http://localhost:11434

search:
  provider: duckduckgo      # duckduckgo | none

conversation_memory:
  enabled: true
  max_history: 20

tools:
  web_search: true
