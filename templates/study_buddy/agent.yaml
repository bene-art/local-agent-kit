# Study Buddy template — explain, quiz, reinforce on supplied material.
#
# A quiz state machine runs in Python — tracks current question, expected
# answer, score. The model only renders the question and grades the user's
# response.

#
# Run from the kit:  lak bot templates/study_buddy

name: StudyBuddy
model: gemma4:e4b

temperature: 0.3
max_tokens: 350

# Explanations and grades are short by IDENTITY rule (two or three
# sentences). Disable the reasoning-token phase so the tight budget
# isn't eaten before any visible content is generated.
think: false

ollama_host: http://localhost:11434

search:
  provider: none           # source material is loaded from disk, not searched

conversation_memory:
  enabled: true
  max_history: 8

tools:
  web_search: false
