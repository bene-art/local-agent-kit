    label: study_buddy-e4b
    config:
      agent_dir: ../

defaultTest:
  options:
    provider:
      id: ollama:chat:gemma4:e4b
  assert:
    - type: llm-rubric
      value: |
        Response follows the Study Buddy IDENTITY rules:
        (a) Explanations stay within the supplied source material.
