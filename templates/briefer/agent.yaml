# Briefer template — scheduled summaries pushed to a channel.
#
# A data fetcher runs on cron, formats results deterministically in Python,
# wraps them in [SYSTEM DATA], and asks the model only to add one sentence
# of framing. Python computes — model narrates.
#
# Status: BLOCKED — needs `Scheduler` runtime (croniter dependency pending).
# See STATUS.md.
#
# Run from the kit:  lak bot templates/briefer

name: Briefer
model: gemma4:e4b
channel: cli               # swap to "telegram" once TG_BOT_TOKEN + TG_CHAT_ID are set

temperature: 0.2           # narration wants almost no variation
max_tokens: 250

# Reasoning models eat tokens before producing visible output; briefer's
# 250-token budget is too small to afford the thinking phase. Off for this
# template — it's pure narration, no reasoning needed.
think: false

ollama_host: http://localhost:11434

search:
  provider: none           # data comes from the schedule's fetcher, not search

conversation_memory:
  enabled: false           # briefs are stateless

tools:
  web_search: false

schedules:
  - name: morning_brief
    cron: "0 7 * * *"
    prompt: "Frame today's headlines in one or two sentences. Do not invent stories not listed."
    channel: cli
    fetcher: templates.briefer.fetch_news:get_headlines
