description: Briefer template — narrate-only contract

prompts:
  - "{{user}}"

providers:
  - id: python:../../../src/local_agent_kit/eval/promptfoo_provider.py
    label: briefer-e4b
    config:
      agent_dir: ../

# Deterministic asserts only — no LLM grader. Each case sets its own
# topic-specific asserts in writer_eval.jsonl.
defaultTest:
  assert:
    - type: javascript
      value: output.trim().length > 5
    - type: not-icontains
      value: please provide
    - type: not-icontains
      value: please paste
    - type: not-icontains
      value: "here is your brief"

tests: file://briefer_eval.jsonl
