description: Writer template — edit, draft, tone-shape

prompts:
  - "{{user}}"

providers:
  - id: python:../../../src/local_agent_kit/eval/promptfoo_provider.py
    label: writer-e4b
    config:
      agent_dir: ../

# Default asserts apply to every case — these enforce the IDENTITY structural
# rules without needing an LLM grader (more reliable than small-model grading).
# Each case adds its own asserts on top via the `assert` field in writer_eval.jsonl.
defaultTest:
  assert:
    - type: javascript
      value: output.trim().length > 10
    - type: not-icontains
      value: please provide
    - type: not-icontains
      value: please paste
    - type: not-icontains
      value: waiting for user
    - type: not-icontains
      value: "here is"
    - type: not-icontains
      value: "i've edited"
    - type: not-icontains
      value: "i have edited"

tests: file://writer_eval.jsonl
