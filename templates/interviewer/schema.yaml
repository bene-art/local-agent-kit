# Example interview schema — a project retrospective intake.
#
# Edit this file to fit your interview. Each step needs an `id` and a
# `prompt`. Optional fields:
#   capture: false   skip storing the response (intros, transitions)
#   follow_up: "..." one optional clarifying re-prompt if the answer is thin
#   next: "id"       jump to a specific step instead of advancing linearly

steps:
  - id: intro
    prompt: "I'm going to ask a handful of questions about your project. Ready?"
    capture: false

  - id: goal
    prompt: "What was the goal of this work?"
    follow_up: "Specifically — what did 'done' look like?"

  - id: role
    prompt: "What was your role on it?"

  - id: outcome
    prompt: "What actually shipped, and how did the outcome compare to the goal?"

  - id: blockers
    prompt: "What blocked you most, and how did you handle it?"
    follow_up: "Was that blocker technical, organizational, or something else?"

  - id: learnings
    prompt: "What's the one thing you'd do differently if you started over?"

  - id: closing
    prompt: "Anything else worth capturing before we wrap?"
    capture: true
