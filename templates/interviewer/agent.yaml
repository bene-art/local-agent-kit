# Interviewer template — conduct a structured Q&A, produce a markdown output.
#
# A FormFlow primitive declares the questions, validation, and output template.
# Python drives — model only renders questions warmly and extracts answers.
#
# Status: BLOCKED — needs the FormFlow primitive. See STATUS.md.
#
# Run from the kit:  lak bot templates/interviewer

name: Interviewer
model: gemma4:e4b
channel: cli

temperature: 0.4
max_tokens: 250

ollama_host: http://localhost:11434

search:
  provider: none

conversation_memory:
  enabled: true
  max_history: 8

tools:
  web_search: false

# Once FormFlow lands, declare the interview schema:
# interview:
#   schema: ./schema.yaml
#   output: ./outputs/{{timestamp}}.md
