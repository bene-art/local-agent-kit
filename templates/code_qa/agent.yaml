# Code Q&A template — explain, suggest fixes, write small snippets.
#
# Status: BLOCKED — needs `file_read` tool from the tools track. See STATUS.md.
#
# Run from the kit:  lak bot templates/code_qa

name: CodeQA
model: gemma4:e4b
channel: cli

temperature: 0.2           # code wants determinism
max_tokens: 600

ollama_host: http://localhost:11434

search:
  provider: none

conversation_memory:
  enabled: true
  max_history: 8

tools:
  web_search: false
  # When the user mentions a file path that exists under one of these
  # roots, the agent auto-reads it and injects the content as [SYSTEM DATA]
  # before responding. "." resolves to the working directory you run
  # `lak bot` from — useful when you cd into your project first.
  file_read:
    roots: ["."]
    max_chars: 4000
