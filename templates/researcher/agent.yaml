# Researcher template — web search + grounded synthesis.
#
# The kit fetches search results, injects them as [SYSTEM DATA], the model
# answers from that data. Never from training knowledge alone.
#
# Run from the kit:  lak bot templates/researcher

name: Researcher
model: gemma4:e4b
channel: cli

temperature: 0.3           # synthesis wants groundedness, not creativity
max_tokens: 600

ollama_host: http://localhost:11434

search:
  provider: duckduckgo     # set GEMINI_API_KEY and change to "gemini" for better results

conversation_memory:
  enabled: true
  max_history: 6

tools:
  web_search: true
