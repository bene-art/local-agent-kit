description: Researcher template — web search + grounded synthesis

prompts:
  - "{{user}}"

providers:
  - id: python:../../../src/local_agent_kit/eval/promptfoo_provider.py
    label: researcher-e4b
    config:
      agent_dir: ../

# Deterministic asserts apply to every case — they catch deflection,
# emptiness, and inventing-when-no-data. Per-case `assert` fields add
# topic-specific checks.
defaultTest:
  assert:
    - type: javascript
      value: output.trim().length > 15
    - type: not-icontains
      value: please provide
    - type: not-icontains
      value: please paste

tests: file://researcher_eval.jsonl
