name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[schedule]"
          pip install ruff==0.15.21 mypy pre-commit

      - name: Ruff
        run: ruff check src/ tests/ templates/

      - name: Mypy
        run: mypy --ignore-missing-imports src/

      # The privacy gate (secrets scan + internal-vocab scrub) must run in
      # CI, not just on contributors' machines with pre-commit installed.
      - name: Pre-commit hooks
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[schedule]"
          pip install pytest pytest-asyncio

      - name: Verify import
        run: python -c "import local_agent_kit; print(local_agent_kit.__version__)"

      - name: Validate Python syntax
        run: python -m compileall -q src/

      - name: Run tests
        run: pytest -q tests/
