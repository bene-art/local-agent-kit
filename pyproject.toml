[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-kit"
version = "0.4.0"
description = "Build local-first AI agents on consumer hardware. Model-agnostic, channel-agnostic, eval-driven."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Benjamin Easington", email = "bene-art@users.noreply.github.com"},
]
keywords = ["ai", "agent", "local", "ollama", "eval", "sovereign"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
schedule = ["croniter>=2.0"]
all = ["croniter>=2.0"]

[project.scripts]
lak = "local_agent_kit.cli:main"

[project.urls]
Homepage = "https://github.com/bene-art/local-agent-kit"
"Reference Agent" = "https://github.com/bene-art/patrick-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_agent_kit = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
